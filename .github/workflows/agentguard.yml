name: AgentGuard Quality Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-validation:
    runs-on: ubuntu-latest
    env:
      PYTHON_DOTENV_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        # Match the local environment until a dependency manifest is added.
        run: >-
          python -m pip install
          openai-agents==0.22.2
          python-dotenv==1.2.3
          PyYAML==6.0.3
          pytest==9.1.1

      - name: Run offline tests
        run: python -m pytest tests -q

      - name: Run AgentGuard live evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/run_agentguard_eval.py
