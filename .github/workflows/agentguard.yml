name: AgentGuard Quality Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_evaluation:
        description: "Run credentialed live smoke and release qualification"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  quality-validation:
    runs-on: ubuntu-latest
    env:
      PYTHON_DOTENV_DISABLED: "1"
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      OPENAI_AGENTS_DISABLE_TRACING: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline tests
        env:
          AGENTGUARD_PRODUCTION_TRANSPORT_REPORT: reports/release_13e4/transport.json
        run: python -m pytest tests -q

      - name: Run AgentGuard live evaluation
        if: github.event_name == 'workflow_dispatch' && inputs.run_live_evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/run_agentguard_eval.py --suite smoke --release-qualification

      - name: Retain release qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentguard-release-qualification
          path: reports/release_13e4/
          if-no-files-found: warn
